name: release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  CARGO_INCREMENTAL: 0
permissions:
  contents: write
jobs:
  release:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            deb: true
          - os: ubuntu-latest
            target: arm-unknown-linux-musleabihf
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            deb: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            deb: true
          - os: ubuntu-latest
            target: i686-unknown-linux-musl
            deb: true
          - os: ubuntu-latest
            target: riscv64gc-unknown-linux-musl
            deb: true
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: ubuntu-latest
            target: armv7-linux-androideabi
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get version
        id: get_version
        uses: SebRollen/toml-action@v1.2.0
        with:
          file: Cargo.toml
          field: package.version
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          target: ${{ matrix.target }}
      - name: Setup cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: ${{ runner.os == 'Linux' }}
        uses: actions-rs/cargo@v1
        with:
          command: install
          args: --color=always --git=https://github.com/cross-rs/cross.git --locked --rev=e281947ca900da425e4ecea7483cfde646c8a1ea --verbose cross
      - name: Install cargo-wix
        if: ${{ runner.os == 'Windows' }}
        uses: actions-rs/cargo@v1
        env:
          # cargo-wix does not require the static crt
          RUSTFLAGS: ""
        with:
          command: install
          args: --version 0.3.9 cargo-wix
      - name: Build binary
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --locked --target=${{ matrix.target }} --color=always --verbose
          use-cross: ${{ runner.os == 'Linux' }}
      - name: Install cargo-deb
        if: ${{ matrix.deb == true }}
        uses: actions-rs/install@v0.1
        with:
          crate: cargo-deb
      - name: Build deb
        if: ${{ matrix.deb == true }}
        uses: actions-rs/cargo@v1
        with:
          command: deb
          args: --no-build --no-strip --output=. --target=${{ matrix.target }}
      - name: Package (*nix)
        if: runner.os != 'Windows'
        run: |
          tar -cv CHANGELOG.md LICENSE README.md man/ \
            -C contrib/ completions/ -C ../ \
            -C target/${{ matrix.target }}/release/ zoxide |
            gzip --best > \
            zoxide-${{ steps.get_version.outputs.value }}-${{ matrix.target }}.tar.gz
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          7z a zoxide-${{ steps.get_version.outputs.value }}-${{ matrix.target }}.zip `
            CHANGELOG.md LICENSE README.md ./man/ ./contrib/completions/ `
            ./target/${{ matrix.target }}/release/zoxide.exe
      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo wix -v --no-build --nocapture -I install/windows/main.wxs `
            --target ${{ matrix.target }} `
            --output zoxide-${{ steps.get_version.outputs.value }}-${{ matrix.target }}.msi
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            *.deb
            *.tar.gz
            *.zip
            *.msi
      - name: Create release
        if: |
          github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release)')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            *.deb
            *.tar.gz
            *.zip
            *.msi
          name: ${{ steps.get_version.outputs.value }}
          tag_name: ""
  # Fork-only: install each Windows MSI on a matching runner and check the result.
  msi-install-test:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            machine: 0x8664
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            machine: 0xAA64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.target }}
      - name: Install, check, and uninstall the MSI
        shell: pwsh
        run: |
          $msi = (Get-ChildItem *.msi | Select-Object -First 1).FullName
          function Invoke-Msi($verb, $log) {
            $p = Start-Process msiexec -ArgumentList "$verb `"$msi`" /qn /l*v $log" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "msiexec $verb failed: $($p.ExitCode)" }
          }
          Invoke-Msi '/i' install.log
          $exe = Join-Path $env:ProgramFiles 'zoxide\bin\zoxide.exe'
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          $item = Get-Item $exe
          if ($item.LinkType) { throw "zoxide.exe is a $($item.LinkType), not a file" }
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          "PE machine: 0x{0:X4}" -f $machine
          if ($machine -ne ${{ matrix.machine }}) { throw "unexpected PE machine type" }
          # A new SSH session gets the machine PATH, so resolve zoxide through it alone.
          $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if ($machinePath -notlike '*\zoxide\bin*') { throw 'zoxide\bin is not on the machine PATH' }
          $env:Path = $machinePath
          (Get-Command zoxide).Source
          zoxide --version
          if ($LASTEXITCODE -ne 0) { throw 'zoxide --version failed' }
          # Over SSH: the original problem is that winget's portable install puts a
          # symlink on PATH, which Windows does not follow in SSH sessions.
          $sshd = Get-Service sshd -ErrorAction SilentlyContinue
          if (-not $sshd) { Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null }
          Start-Service sshd
          $key = Join-Path $env:TEMP 'zx_ed25519'
          ssh-keygen -q -t ed25519 -N '""' -f $key
          $auth = 'C:\ProgramData\ssh\administrators_authorized_keys'
          Get-Content "$key.pub" | Set-Content $auth -Encoding ascii
          icacls $auth /inheritance:r /grant 'Administrators:F' /grant 'SYSTEM:F' | Out-Null
          $ssh = @('-i', $key, '-o', 'StrictHostKeyChecking=no', '-o', 'BatchMode=yes', "$env:USERNAME@localhost")
          'MSI install over SSH:'
          ssh @ssh 'zoxide --version'
          if ($LASTEXITCODE -ne 0) { throw 'zoxide failed over SSH after the MSI install' }
          # Comparison: a winget-style portable symlink on the machine PATH.
          $links = 'C:\WinGetLinksDemo'
          New-Item -ItemType Directory $links | Out-Null
          New-Item -ItemType SymbolicLink -Path "$links\zoxide-portable.exe" -Target $exe | Out-Null
          [Environment]::SetEnvironmentVariable('Path', "$machinePath;$links", 'Machine')
          Restart-Service sshd
          'Portable-style symlink over SSH (expected to fail):'
          ssh @ssh 'zoxide-portable --version'
          "symlink exit code: $LASTEXITCODE"
          [Environment]::SetEnvironmentVariable('Path', $machinePath, 'Machine')
          Invoke-Msi '/x' uninstall.log
          if (Test-Path $exe) { throw 'zoxide.exe remains after uninstall' }
          if ([Environment]::GetEnvironmentVariable('Path', 'Machine') -like '*\zoxide\bin*') { throw 'PATH entry remains after uninstall' }
          'install, PATH lookup, and uninstall OK'
